name: autofix.ci
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2
      - run: bun i
      - run: bun run format
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
