name: autolabel
on:
  pull_request:
    types: [opened, edited, labeled, unlabeled]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: c4illin/autolabel@v1
        with:
          type_labels: |
            feat: Feature
            fix: Fix
            docs: Docs
            style: Style
            refactor: Refactor
            perf: Performance
            test: Test
            build: Build
            ci: CI
            revert: Revert
            breaking: Breaking
